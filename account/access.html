<section class="frame account-screen" id="account-screen" aria-labelledby="account-title">
  <div class="account-intro">
    <h1 id="account-title">Phi Asset Management</h1>
    <p>Acciones, CEDEARs y ETF</p>
  </div>
  <div class="account-panel">
    <p id="account-status" role="status">Cargando acceso…</p>
    <a id="account-continue" class="asset-btn" href="/monitor" hidden>Abrir monitor</a>
    <div id="account-form"></div>
    <button id="account-recover" class="recovery-link" type="button" hidden>¿Olvidaste tu contraseña?</button>
    <form id="account-recovery" hidden>
      <h2>Recuperar contraseña</h2>
      <label for="recovery-email">Correo electrónico</label>
      <input id="recovery-email" name="email" type="email" autocomplete="email">
      <label for="recovery-code" hidden>Código que recibiste por correo</label>
      <input id="recovery-code" name="code" inputmode="numeric" autocomplete="one-time-code" hidden>
      <label for="recovery-password" hidden>Nueva contraseña</label>
      <input id="recovery-password" type="password" name="password" autocomplete="new-password" hidden>
      <p id="recovery-status" role="status"></p>
      <button id="recovery-next" class="asset-btn" type="submit">Enviar código</button>
      <a class="recovery-link" href="/">Volver a ingresar</a>
    </form>
  </div>
</section>
<dialog id="account-preferences" aria-labelledby="preferences-title">
  <div class="dialog-head">
    <h2 id="preferences-title">Configuración de cuenta</h2>
    <button id="close-preferences" class="asset-btn" type="button" aria-label="Cerrar configuración">✕</button>
  </div>
  <form id="preferences-form">
    <label for="display-name">Nombre visible</label>
    <input id="display-name" name="display-name" type="text" maxlength="60" autocomplete="nickname" required>
    <p class="muted">Así aparece tu nombre en el saludo del monitor.</p>
    <button id="save-preferences" class="asset-btn" type="submit">Guardar nombre</button>
    <p id="preferences-status" role="status"></p>
  </form>
  <button id="account-security" class="asset-btn" type="button">Correo, contraseña y seguridad</button>
</dialog>
