<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Monitor de acciones, CEDEARs y ETF de Phi Asset Management.">
  <title>Monitor | Phi Asset Management</title>
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="frame top-inner">
      <div class="brand">
        <picture class="monogram">
          <source media="(prefers-reduced-motion: reduce)" srcset="brand.png">
          <img src="brand.gif" alt="" width="144" height="144">
        </picture>
        <div>Phi <span>Asset Management</span></div>
      </div>
      <div class="header-actions">
        <button id="column-language" class="column-language" type="button" aria-label="Mostrar columnas y sectores en inglés" aria-pressed="false"><span lang="es">ES</span><span aria-hidden="true">/</span><span lang="en">EN</span></button>
        <button id="theme" class="theme" type="button" aria-label="Activar tema oscuro" title="Activar tema oscuro"><span aria-hidden="true">☾</span></button>
      </div>
    </div>
  </header>
  <main class="frame">
    <section class="hero" aria-labelledby="heading">
      <div class="hero-content">
        <h1 id="heading">Phi Asset Management</h1>
        <p>Acciones, CEDEARs y ETF</p>
        <section class="metrics" aria-label="Resumen de la planilla" id="metrics"></section>
      </div>
      <div class="hero-visual" aria-hidden="true"><canvas id="hero-art"></canvas></div>
    </section>
    <section class="terminal" aria-label="Monitor de activos">
      <nav id="sheets" class="sheet-tabs" aria-label="Tablas del Excel"></nav>
      <div class="toolbar">
        <label class="search"><span class="sr-only">Buscar compañía o ticker</span><span aria-hidden="true">⌕</span><input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Buscar compañía o ticker"></label>
        <label><span class="sr-only">Sector o temática</span><select id="sector" aria-label="Sector o temática"></select></label>
        <label><span class="sr-only">Orden</span><select id="sort" aria-label="Orden"><option value="name">Compañía A–Z</option><option value="target">Mayor distancia al TARGET</option><option value="forward">Menor P/E futuro</option></select></label>
        <label class="valuation"><input id="only" type="checkbox"> Con datos de valuación</label>
      </div>
      <div class="table-meta">
        <span id="status" role="status">Cargando datos…</span>
        <span id="quote-freshness" class="quote-freshness" role="status"></span>
      </div>
      <div class="mobile-table-tools">
        <span id="mobile-table-hint">Deslizá para ver más columnas</span>
        <button id="mobile-table-mode" class="asset-btn" type="button" aria-controls="table-scroll">Vista compacta</button>
      </div>
      <div id="table-scroll" class="table-scroll" tabindex="0" aria-label="Tabla con desplazamiento horizontal">
        <table id="table"><caption class="sr-only">Activos y columnas del Excel</caption><thead></thead><tbody></tbody></table>
      </div>
      <div id="empty" hidden>No hay activos para estos filtros.</div>
      <div id="data-error" hidden><button type="button" class="asset-btn" id="retry-data">Reintentar</button></div>
      <div class="pager"><button id="prev" type="button">Anterior</button><span id="page"></span><button id="next" type="button">Siguiente</button></div>
    </section>
    <footer><span>Phi Asset Management</span><span>— Dato no disponible</span></footer>
  </main>
  <dialog id="asset" aria-labelledby="asset-title">
    <div class="dialog-head"><div><div id="asset-symbol" class="eyebrow"></div><h2 id="asset-title"></h2></div><button id="close" aria-label="Cerrar ficha" type="button">✕</button></div>
    <div id="asset-body"></div>
  </dialog>
  <script type="application/json" id="monitor-data"></script>
</body>
</html>
